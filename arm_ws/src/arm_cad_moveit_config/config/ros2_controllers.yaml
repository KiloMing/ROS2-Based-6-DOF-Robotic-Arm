controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_trajectory_controller:
  ros__parameters:
    joints:
    - base_joint
    - shoulder_joint
    - elbow_joint
    - wrist_pitch_joint
    - wrist_rotation_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
gripper_trajectory_controller:
  ros__parameters:
    joints:
    - gripper_drive_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
