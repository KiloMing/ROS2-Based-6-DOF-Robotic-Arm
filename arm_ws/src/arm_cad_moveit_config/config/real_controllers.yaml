controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_trajectory_controller:
  ros__parameters:
    joints:
    - base_joint
    - shoulder_joint
    - elbow_joint
    - wrist_pitch_joint
    - wrist_rotation_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.01
      base_joint:
        goal: 0.0872664626
      shoulder_joint:
        goal: 0.0872664626
      elbow_joint:
        goal: 0.0872664626
      wrist_pitch_joint:
        goal: 0.0872664626
      wrist_rotation_joint:
        goal: 0.0872664626
gripper_trajectory_controller:
  ros__parameters:
    joints:
    - gripper_drive_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.01
      gripper_drive_joint:
        goal: 0.0872664626
